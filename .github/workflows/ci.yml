name: ci
# 사람 기억 의존(finding E) 제거: push/PR마다 테스트+하드코딩 스캔을 클라우드에서 자동 실행.
# 로컬 심링크 토폴로지 검사(migration/rehearse.sh)와 skills-catalog 호출 probe는
# 진짜 로컬 머신이 필요하므로 CI 대상에서 제외 — CI 가능한 부분만 올린다.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 테스트 (49건, provider는 mock seam)
        run: python3 -m pytest tests/ -q
      - name: 실행코드 하드코딩 경로 스캔
        run: |
          if git grep -qE "/Users/[^/]+/(Desktop|control|agent)" -- '*.py' '*.sh'; then
            echo "하드코딩 경로 발견 — 실패"; exit 1
          fi
          echo "하드코딩 0 — 통과"
